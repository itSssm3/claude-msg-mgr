name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            ext: ''
            artifact_name: linux-amd64
          - os: windows-latest
            platform: windows/amd64
            ext: '.exe'
            artifact_name: windows-amd64
          - os: macos-latest
            platform: darwin/universal
            ext: ''
            artifact_name: darwin-universal

    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -ldflags "-s -w"

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          BINARY="build/bin/claude-msg-mgr${{ matrix.ext }}"
          # macOS .app bundle
          if [ ! -f "$BINARY" ] && [ -d "build/bin/claude-msg-mgr.app" ]; then
            BINARY="build/bin/claude-msg-mgr.app/Contents/MacOS/claude-msg-mgr"
          fi
          cp "$BINARY" "dist/claude-msg-mgr-${{ matrix.artifact_name }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-msg-mgr-${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: claude-msg-mgr-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
